<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTV Permitting Dashboard — Mecklenburg (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#102538; --slate:#5E8095; --pine:#648370; --cream:#F5F0E7; --white:#FFFFFF;
    --amber:#C98A1B; --red:#B23A3A; --grey:#9AA3AD; --line:#DFD8CC;
    --navy-08:rgba(16,37,56,.08); --navy-04:rgba(16,37,56,.04);
    font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--navy);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:700}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}

  /* Sidebar */
  .side{width:250px;flex:0 0 250px;background:var(--navy);color:var(--cream);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:14px 14px 11px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(245,240,231,.12)}
  .brand img{width:36px;height:auto;filter:brightness(0) invert(1);opacity:.95}
  .brand .t{font-size:12px;font-weight:700;line-height:1.15}
  .brand .s{font-size:9.5px;font-weight:500;opacity:.7;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
  .side-scroll{overflow-y:auto;padding:10px;flex:1}
  .side h4{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;opacity:.6;font-weight:600;margin:4px 4px 8px}
  .plist{display:flex;flex-direction:column;gap:6px}
  .pcard{background:rgba(245,240,231,.06);border:1px solid rgba(245,240,231,.10);border-radius:8px;padding:9px 10px;transition:.12s;cursor:pointer}
  .pcard:hover{background:rgba(245,240,231,.11)}
  .pcard.sel{background:var(--cream);color:var(--navy);border-color:var(--cream)}
  .pcard .pn{font-weight:700;font-size:12px}
  .pcard .pm{font-size:10px;opacity:.8;margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1.5px 6px;border-radius:20px;white-space:nowrap}
  .tag.subdivision{background:#3d5a6c;color:#fff}.tag.sublot{background:#4a6350;color:#fff}.tag.infill{background:#6b6152;color:#fff}
  .pcard.sel .tag.sublot{background:var(--pine)}
  .mini{height:4px;border-radius:6px;background:rgba(245,240,231,.18);margin-top:7px;overflow:hidden}
  .pcard.sel .mini{background:var(--navy-08)}
  .mini>i{display:block;height:100%;background:var(--pine)}
  .alertdot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 2px rgba(178,58,58,.25)}
  .newbtn{margin:10px;padding:10px;border:1px dashed rgba(245,240,231,.4);background:transparent;color:var(--cream);border-radius:8px;font-weight:700;font-size:12px}
  .newbtn:hover{background:rgba(245,240,231,.08)}

  /* Main */
  .main{flex:1;min-width:0}
  .topbar{background:var(--white);border-bottom:1px solid var(--line);padding:10px 20px}
  .crumb{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);font-weight:600}
  .ptitle{display:flex;align-items:center;gap:10px;margin-top:3px;flex-wrap:wrap}
  .ptitle h1{font-size:18px}
  .content{padding:12px 20px 50px;max-width:1200px}

  .banner{background:#fdf6e8;border:1px solid #e9d9ae;color:#6d5716;border-radius:8px;padding:6px 12px;font-size:11px;margin-bottom:10px}
  .pathnote{background:var(--navy);color:var(--cream);border-radius:8px;padding:7px 12px;font-size:11.5px;margin-bottom:10px}
  .pathnote b{color:#e7dcc4}

  /* compact KPI strip + legend on one line each */
  .kstrip{display:flex;gap:0;background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .kpi{flex:1;padding:7px 12px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:none}
  .kpi .l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);font-weight:600}
  .kpi .v{font-size:15px;font-weight:700;margin-top:1px}
  .kpi .v.small{font-size:11px;line-height:1.25}
  .kpi.warn .v{color:var(--red)}.kpi.ok .v{color:var(--pine)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:#54606c;margin-bottom:14px;padding:6px 12px;background:var(--white);border:1px solid var(--line);border-radius:8px;align-items:center}
  .legend .li{display:flex;align-items:center;gap:5px}
  .swatch{width:10px;height:10px;border-radius:2px}
  .gatechip{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--navy);background:#e7dcc4;border:1px solid #d8c8a6;padding:0 5px;border-radius:3px}
  .critchip{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--red);padding:0 5px;border-radius:3px}

  /* ============ FLOWCHART ============ */
  .flow{position:relative}
  .band{display:flex;align-items:stretch;gap:0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 0;box-shadow:0 1px 2px rgba(16,37,56,.05)}
  .bandlab{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-right:1px solid var(--line);margin-right:10px}
  .bandlab .bl{width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--cream);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .bandlab .bn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--slate);max-height:120px;overflow:hidden}
  .nodes{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;flex:1;padding:2px 0}
  .arr{flex:0 0 auto;color:var(--grey);font-size:13px;font-weight:700;padding:0 3px;user-select:none}
  .vconn{display:flex;justify-content:center;color:var(--grey);font-size:13px;font-weight:700;padding:1px 0;line-height:1}

  .node{flex:0 0 auto;width:158px;border:1.5px solid var(--line);border-radius:7px;background:var(--white);padding:6px 8px 5px;cursor:pointer;position:relative;transition:.1s}
  .node:hover{box-shadow:0 2px 8px rgba(16,37,56,.15);transform:translateY(-1px)}
  .node .nt{font-size:10.5px;font-weight:700;line-height:1.25;min-height:26px} /* v4.2: no line-clamp — titles always render in full */
  .node .nm{font-size:9px;color:#6a7580;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .nb{display:flex;gap:4px;align-items:center;margin-top:4px;min-height:12px;flex-wrap:wrap}
  .node.st-done{border-color:var(--pine);background:#eef3ec}
  .node.st-done .nt::before{content:"✓ ";color:var(--pine)}
  .node.st-active{border-color:var(--slate);background:#eff4f7;box-shadow:inset 0 0 0 1px var(--slate)}
  .node.st-submitted{border-color:var(--amber);background:#fdf6e8;box-shadow:inset 0 0 0 1px var(--amber)}
  .node.st-blocked{border-color:var(--red);background:#fbeeee;box-shadow:inset 0 0 0 1px var(--red)}
  .node.st-todo{opacity:.75}
  .node.gate{border-width:2.5px}
  .node.msSel{outline:2.5px solid var(--navy);outline-offset:1px;opacity:1}
  .agebadge{font-size:8.5px;font-weight:700;padding:0 5px;border-radius:10px}
  .agebadge.ok{background:#e4ece1;color:#42604e}
  .agebadge.warn{background:#f6e8cd;color:#8a6412}
  .agebadge.stuck{background:#f3d4d4;color:var(--red)}

  /* detail card (opens under the band of the selected node) */
  .detail{border:1.5px solid var(--navy);border-radius:10px;background:var(--white);padding:10px 14px;margin:6px 0 2px;box-shadow:0 4px 14px rgba(16,37,56,.12)}
  .detail .dt{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .detail .dm{font-size:11px;color:#54606c;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
  .detail .dm b{color:var(--navy);font-weight:600}
  .detail .dn{font-size:11px;color:#6a7580;margin-top:5px;font-style:italic}
  .detail .dn.dep::before{content:"↳ depends on: ";font-style:normal;font-weight:600;color:var(--slate)}
  .ctl{display:flex;gap:10px;align-items:flex-end;margin-top:9px;flex-wrap:wrap}
  .ctl .cg{display:flex;flex-direction:column;gap:3px}
  .ctl label{font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate);font-weight:700}
  select,input[type=date],input[type=text]{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--navy);background:var(--white)}
  select:focus,input:focus{outline:2px solid var(--slate)}
  .xbtn{margin-left:auto;font-size:10px;font-weight:700;color:var(--slate);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
  .xbtn:hover{background:var(--navy-04)}

  details.sys{margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:12px;line-height:1.55}
  details.sys summary{font-weight:700;cursor:pointer;font-size:12px;color:var(--navy)}
  .footer{margin-top:18px;font-size:9.5px;color:#8a94a0;line-height:1.5;border-top:1px solid var(--line);padding-top:10px}

  /* modal (unchanged behavior) */
  .overlay{position:fixed;inset:0;background:rgba(16,37,56,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--cream);border-radius:14px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(16,37,56,.4);overflow:hidden}
  .modal-h{background:var(--navy);color:var(--cream);padding:14px 20px}
  .modal-h h2{font-size:15px}.modal-h p{font-size:11px;opacity:.75;margin:3px 0 0}
  .modal-b{padding:16px 20px}
  .fgroup{margin-bottom:14px}
  .fgroup>label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;display:block;margin-bottom:6px}
  .fgroup input[type=text]{width:100%}
  .paths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .pathopt{border:1.5px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;background:var(--white)}
  .pathopt:hover{border-color:var(--slate)}
  .pathopt.sel{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-08)}
  .pathopt .pon{font-weight:700;font-size:12px}
  .pathopt .pox{font-size:9.5px;color:#6a7580;margin-top:3px;line-height:1.3}
  .checks{display:flex;flex-direction:column;gap:6px}
  .chkrow{display:flex;gap:8px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
  .chkrow input{margin-top:2px;width:14px;height:14px;accent-color:var(--pine)}
  .chkrow .cn{font-weight:600;font-size:11.5px}
  .chkrow .cx{font-size:10px;color:#6a7580;margin-top:1px}
  .modal-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
  .btn{padding:8px 15px;border-radius:8px;font-weight:700;font-size:12px;border:1px solid transparent}
  .btn.primary{background:var(--navy);color:var(--cream)}.btn.primary:hover{background:#1b3a56}
  .btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
  @media(max-width:900px){.side{display:none}.kstrip{flex-wrap:wrap}.kpi{flex:1 1 45%}.paths{grid-template-columns:1fr}}

  /* ── tracks view (v3): one lane per track, left→right staging from the dep graph ── */
  .viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
  .viewtoggle button{border:none;background:var(--white);color:#54606c;font:inherit;font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 12px;cursor:pointer}
  .viewtoggle button.on{background:var(--navy);color:var(--cream)}
  .tracks{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 12px 16px;overflow-x:auto;position:relative}
  .tgrid{position:relative;min-width:max-content}
  .taxis,.tlane{display:grid;align-items:stretch}
  .taxis{grid-auto-flow:column}
  .tlane{grid-auto-flow:row dense} /* same-column steps in a lane stack vertically instead of overlapping */
  .taxis>div{font-size:8.5px;color:#a9b0b8;font-weight:700;letter-spacing:.4px;border-left:1px dashed #eee3cf;padding:0 0 3px 6px}
  .taxis>div:first-child{border:none}
  .tlane{position:relative;min-height:56px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 117px,#f2ecdf 117px,#f2ecdf 118px);background-position:140px 0}
  .tlane + .tlane{border-top:1px dashed #efe8d8}
  .tlab{grid-row:1/-1;padding:9px 12px 9px 2px;position:sticky;left:0;background:var(--white);z-index:3}
  .tlab .b{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.8px;color:#fff;border-radius:3px;padding:1px 6px;margin-bottom:3px}
  .tlab .l{font-size:10.5px;font-weight:800;line-height:1.25}
  .tlab .d{font-size:8.5px;color:#8a94a0;font-weight:600;line-height:1.35}
  .tcell{padding:6px 4px;display:flex}
  .tcell .node{flex:1;margin:0;min-width:110px}
  .tcell.pack{flex-wrap:wrap;gap:8px;align-content:flex-start}
  .tcell.pack .node{flex:0 1 150px;min-width:130px}
  .tcell.locked .node{opacity:.55;border-style:dashed;filter:grayscale(.35)}
  .tcell.locked .node .nt::before{content:"🔒 ";font-size:9px}
  .gdrop{position:absolute;width:2px;background:repeating-linear-gradient(to bottom,var(--red) 0 5px,transparent 5px 9px);z-index:2;pointer-events:none}
  .gdrop::after{content:attr(data-lbl);position:absolute;bottom:8px;left:5px;font-size:8px;font-weight:800;color:var(--red);white-space:nowrap}
  .gdrop.soft{background:repeating-linear-gradient(to bottom,var(--amber) 0 3px,transparent 3px 8px);opacity:.85}
  .gdrop.soft::after{color:var(--amber)}
  .heldchip{display:inline-block;font-size:7.5px;font-weight:800;letter-spacing:.4px;color:#fff;background:var(--amber);border-radius:3px;padding:1px 5px}
  .unitchip{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.5px;color:#fff;background:var(--amber);border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:1px}
  .delbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;color:#9B3B2E;font-size:9.5px;font-weight:700;padding:3px 9px;cursor:pointer;font-family:inherit}
  .delbtn:hover{background:#f8ecea;border-color:#9B3B2E}
  #toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{background:#9B3B2E}
  .refin{width:130px}
  .tag.both{background:#6b4f86;color:#fff}

  /* Accela (v4.6): the City's record sets the status of every step that carries an LDIRL / LDPLAT number */
  .acchip{display:inline-block;font-size:7.5px;font-weight:800;letter-spacing:.3px;border-radius:3px;padding:0 5px;white-space:nowrap;border:1px solid transparent;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .acchip.ac-done{background:#e4ece1;color:#42604e;border-color:#c9d8c4}
  .acchip.ac-submitted{background:#fdf1db;color:#8a6412;border-color:#ecd7a8}
  .acchip.ac-active{background:#f6e3c4;color:#7a4f0a;border-color:#e2bf83}
  .acchip.ac-blocked{background:#f3d4d4;color:var(--red);border-color:#e3b3b3}
  .acchip.ac-none{background:#eef0f2;color:#54606c;border-color:#dde1e5}
  .node a.acref{color:var(--slate);font-weight:700;text-decoration:none}
  .node a.acref:hover{text-decoration:underline}
  .acbox{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:#fbf9f4;padding:8px 11px;font-size:11px}
  .acbox .ach{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .acbox a{color:var(--navy)}
  .acbox .acw{margin-top:3px;color:#54606c}
  .acsteps{margin-top:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 14px}
  .acsteps div{font-size:10px;color:#54606c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acsteps b{color:var(--navy);font-weight:600}
  .acsteps .ok::before{content:"✓ ";color:var(--pine)}
  .acsteps .now::before{content:"● ";color:var(--amber)}
  .acsteps .wait::before{content:"○ ";color:#b8bfc6}
  .lockn{font-size:8.5px;color:var(--slate);font-weight:600;text-transform:none;letter-spacing:0}

</style>
</head>
<body>
<div class="app">

const today=new Date();today.setHours(0,0,0,0);
/* Parse YYYY-MM-DD as LOCAL midnight (new Date('YYYY-MM-DD') is UTC and shifts a day in US timezones). */
function pdate(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);}
function fmtDate(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function daysBetween(a,b){return Math.round((a-b)/86400000);}
function resolveDep(m,f){return typeof m.dep==='function'?m.dep(f):m.dep;}
function catalogFor(f){return CATALOG.filter(m=>m.show(f));}

/* v4 flag model: two independent setup questions — Subdivide? × Sublot? — plus scope flags.
   migrateFlags() maps legacy payloads (path:'sublot'|'subdivision'|'infill', parentSub) onto it,
   and derives f.path as a display label so old CSS tags keep working. */
function migrateFlags(f){
  if(f.subdiv==null&&f.sublot==null){
    f.subdiv=f.path==='subdivision'||!!f.parentSub;
    f.sublot=f.path==='sublot';
  }
  f.subdiv=!!f.subdiv;f.sublot=!!f.sublot;
  f.path=f.subdiv&&f.sublot?'both':f.subdiv?'subdivision':f.sublot?'sublot':'infill';
  return f;
}
/* Old payloads won't have state entries for new catalog ids (subplat-*) — backfill as todo. */
function fixState(p){
  migrateFlags(p.flags);
  catalogFor(p.flags).forEach(m=>{if(!p.state[m.id])p.state[m.id]={status:'todo',owner:m.owner,due:'',started:null};});
  return p;
}

let PROJECTS=[], selId=null, selMs=null, viewMode='tracks'; /* 'tracks' | 'phases' — in-memory only (no new storage keys per AGENTS.md) */

/* ── tracks view engine (v3) ─────────────────────────────────────────────
   Column = dependency depth, computed from the live dep graph, so the
   left→right staging updates itself when the catalog changes.
   Staging-only extra: on plat paths, bp-sub is staged after plat-rec too,
   honoring the HARD-gate note (recorded plat + address → County permit)
   without changing the catalog's data-level dependency. */
const TRACKS=[
  {key:'in', b:'#8a94a0', name:'Intake · all parallel', d:'no order implied — survey kicks off first', ids:['survey','water-cap','driveway','ncdot','uw'], pack:true},
  {key:'dm', b:'#7a5c3a', name:'Track D · Demolition', d:'only if tearing down', ids:['neshap','hist','disc','demo-permit','demo-done'], pack:true},
  {key:'a1', b:'#b9a06a', name:'Track A1 · Subdivision plat', d:'parent split — gates the per-lot work', ids:['subplat-prep','subplat-app','subplat-rec']},
  {key:'a',  b:'var(--slate)', name:'Track A · Sublot plat (LDPLAT)', d:'the long pole — gates Track C', ids:['plat-prep','plat-app','plat-rec']},
  {key:'bt', b:'var(--pine)', name:'Track B · LDIRL', d:'trees ride INSIDE it — tandem on sublot-only; after A1 when subdividing. Addresses file once the LDIRL (or LDPLAT) is approved', ids:['dev-ldirl','address','erosion']},
  {key:'c',  b:'var(--navy)', name:'Track C · Permits & build', d:'starts where the gate drops', ids:['plans','bp-sub','bp-iss','stake','trades','taps','insp','tree-prot','final-insp','co','closeout']}
];
/* Dep grammar: 'a|b' = waits on ALL of a and b; 'a/b' = waits on ANY ONE of a or b (whichever is done first).
   Returns the required groups; each group is a list of alternatives. */
function depGroups(m,p,byId){
  const d=resolveDep(m,p.flags);
  let gs=d?String(d).split('|').map(g=>g.split('/').filter(id=>byId[id])).filter(g=>g.length):[];
  if(m.id==='bp-sub' && p.flags.sublot && byId['plat-rec'] && !gs.some(g=>g.length===1&&g[0]==='plat-rec')) gs.push(['plat-rec']);
  return gs;
}
function trackCols(p){
  const cat=catalogFor(p.flags), byId=Object.fromEntries(cat.map(m=>[m.id,m]));
  const col={}, start={};
  function calc(id,seen){
    if(col[id]!=null)return;
    if(seen.has(id)){col[id]=1;start[id]=0;return;}
    seen.add(id);
    const gs=depGroups(byId[id],p,byId);
    gs.flat().forEach(d=>calc(d,seen));
    /* an any-of group is staged after its EARLIEST alternative */
    col[id]=gs.length?Math.max(...gs.map(g=>Math.min(...g.map(d=>col[d]))))+1:1;
    start[id]=gs.length?Math.max(...gs.map(g=>Math.min(...g.map(d=>start[d]+(byId[d].exp||7))))):0;
  }
  cat.forEach(m=>calc(m.id,new Set()));
  /* compact: drop column indices no milestone uses, so the grid never carries empty columns */
  const used=[...new Set(Object.values(col))].sort((a,b)=>a-b), remap={};
  used.forEach((c,i)=>remap[c]=i+1);
  Object.keys(col).forEach(id=>col[id]=remap[col[id]]);
  return {col,start,byId,cat};
}
function tracksHtml(p){
  const {col,start,cat}=trackCols(p);
  const ncols=Math.max(...cat.map(m=>col[m.id]));
  const gridCols=`140px repeat(${ncols},118px)`; /* fixed width: identical geometry on every project (same flags → same map) */
  /* indicative week label per column = earliest expected start among its milestones */
  const wk={};cat.forEach(m=>{const c=col[m.id];const w=Math.floor(start[m.id]/7)+1;wk[c]=wk[c]==null?w:Math.min(wk[c],w);});
  let axis=`<div class="taxis" style="grid-template-columns:${gridCols}"><div style="grid-column:1"></div>`;
  for(let c=1;c<=ncols;c++)axis+=`<div style="grid-column:${c+1}">~wk ${wk[c]||'?'}</div>`;
  axis+=`</div>`;
  let lanes='';
  TRACKS.forEach(tr=>{
    const ms=tr.ids.map(id=>cat.find(m=>m.id===id)).filter(Boolean);
    if(!ms.length)return; /* lanes with nothing visible for this path/flags are hidden */
    const byId=Object.fromEntries(cat.map(x=>[x.id,x]));
    let cells='';
    if(tr.pack){ /* pre-track lanes: genuinely parallel work — pack compactly, no staging columns */
      cells=`<div class="tcell pack" style="grid-column:2/-1">${ms.map(m=>p.state[m.id]?nodeHtml(p,m):'').join('')}</div>`;
    }else ms.forEach(m=>{
      const c=p.state[m.id];if(!c)return;
      const locked=c.status==='todo'&&depGroups(m,p,byId).some(g=>g.every(d=>p.state[d]&&p.state[d].status!=='done'));
      cells+=`<div class="tcell${locked?' locked':''}" style="grid-column:${col[m.id]+1}" data-ms="${m.id}">${nodeHtml(p,m)}</div>`;
    });
    lanes+=`<div class="tlane" style="grid-template-columns:${gridCols}"><div class="tlab" style="grid-column:1"><span class="b" style="background:${tr.b}">${esc(tr.name.split('·')[0].trim().toUpperCase())}</span><div class="l">${esc(tr.name.includes('·')?tr.name.split('·')[1].trim():tr.name)}</div><div class="d">${esc(tr.d)}</div></div>${cells}</div>`;
  });
  return `<div class="tracks"><div class="tgrid" id="tgrid">${axis}${lanes}</div></div>`;
}
function drawGateDrop(){
  const grid=document.getElementById('tgrid');if(!grid)return;
  /* one connector per gate that actually exists on this project's map.
     The line is anchored at the UPPER node and drops toward the lower lane —
     'soft' = release gate (amber, dotted): plat approval is HELD until the LDIRL clears. */
  [['plat-rec','bp-sub','plat → permit gate',''],
   ['subplat-rec','dev-ldirl','subdivision → per-lot gate',''],
   ['plat-app','dev-ldirl','plat released only WITH LDIRL approval','soft']].forEach(([a,b,lbl,cls])=>{
    const na=grid.querySelector(`[data-ms="${a}"] .node`)||grid.querySelector(`[data-ms="${a}"]`);
    const nb=grid.querySelector(`[data-ms="${b}"] .node`)||grid.querySelector(`[data-ms="${b}"]`);
    if(!na||!nb)return;
    const g=grid.getBoundingClientRect(),ra=na.getBoundingClientRect(),rb=nb.getBoundingClientRect();
    const up=ra.top<rb.top?ra:rb, lo=up===ra?rb:ra;
    if(lo.top-up.bottom<8)return;
    const d=document.createElement('div');d.className='gdrop'+(cls?' '+cls:'');d.setAttribute('data-lbl',lbl);
    d.style.left=(up.left-g.left+up.width/2)+'px';
    d.style.top=(up.bottom-g.top-4)+'px';
    d.style.height=Math.max(20,(lo.top-g.top)-(up.bottom-g.top)+10)+'px';
    grid.appendChild(d);
  });
}

function ageInfo(m,c){
  if(!c.started||(c.status!=='active'&&c.status!=='submitted'))return null;
  const s=pdate(c.started);
  const age=daysBetween(today,s),over=age-m.exp;
  let cls='ok';if(over>0)cls='stuck';else if(age>=m.exp*0.7)cls='warn';
  return{age,over,cls};
}
function projStats(p){
  const cat=catalogFor(p.flags);
  let done=0,blocked=0,stuck=0,pastdue=0,firstActive=null,firstTodo=null;
  cat.forEach(m=>{const c=p.state[m.id];if(!c)return;
    if(c.status==='done')done++;
    if(c.status==='blocked')blocked++;
    const a=ageInfo(m,c);if(a&&a.cls==='stuck')stuck++;
    if(c.due&&c.status!=='done'&&pdate(c.due)<today)pastdue++;
    if(!firstActive&&(c.status==='active'||c.status==='submitted'||c.status==='blocked'))firstActive=m.t;
    if(!firstTodo&&c.status==='todo')firstTodo=m.t;
  });
  return{done,total:cat.length,blocked,stuck,pastdue,pct:Math.round(done/cat.length*100),current:firstActive||firstTodo||'All milestones complete'};
}

function render(){renderList();renderProject();}
function renderList(){
  const el=document.getElementById('plist');el.innerHTML='';
  PROJECTS.forEach(p=>{
    const s=projStats(p),alert=(s.blocked+s.stuck+s.pastdue)>0;
    const d=document.createElement('div');
    d.className='pcard'+(p.id===selId?' sel':'');
    d.onclick=()=>{selId=p.id;selMs=null;render();};
    d.innerHTML=`<div class="pn">${esc(p.addr)}</div>
      <div class="pm"><span class="tag ${p.flags.path}">${p.flags.path}</span>${p.flags.demo?'<span class="tag" style="background:#7a5c3a;color:#fff">demo</span>':''}${alert?'<span class="alertdot"></span>':''}</div>
      <div class="mini"><i style="width:${s.pct}%"></i></div>`;
    el.appendChild(d);
  });
}

function nodeHtml(p,m){
  const c=p.state[m.id],a=ageInfo(m,c);
  let badge='';
  if(a){
    if(a.cls==='stuck')badge=`<span class="agebadge stuck">${a.age}d · +${a.over}</span>`;
    else if(a.cls==='warn')badge=`<span class="agebadge warn">${a.age}d</span>`;
    else badge=`<span class="agebadge ok">${a.age}d</span>`;
  }
  let pd='';if(c.due&&c.status!=='done'&&pdate(c.due)<today)pd=`<span class="agebadge stuck">past due</span>`;
  /* release gate: an in-review/approved-but-unreleased plat is held until the LDIRL clears */
  let held='';
  if(m.id==='plat-app'&&(c.status==='submitted'||c.status==='active')&&p.state['dev-ldirl']&&p.state['dev-ldirl'].status!=='done')
    held=`<span class="heldchip">⛓ held by LDIRL</span>`;
  let mult='';
  if(m.perUnit&&(p.units||0)>1)mult=`<span class="unitchip">×${p.units}</span>`;
  else if(m.perLot&&(p.lots||0)>1)mult=`<span class="unitchip">×${p.lots}</span>`;
  const cref=cityRef(c.ref);
  const ref=c.ref?` <span class="nm" style="color:var(--slate);font-weight:700">${cref?`<a class="acref" href="${ACCELA_URL(cref)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open in Accela">${esc(c.ref)}</a>`:esc(c.ref)}</span>`:'';
  return `<div class="node st-${c.status} ${m.gate?'gate':''} ${selMs===m.id?'msSel':''}" onclick="selectMs('${m.id}')">
    <div class="nt">${m.t}${mult}</div>
    <div class="nm">${esc(c.vendor||m.agency)}${ref}</div>
    <div class="nb">${m.gate?'<span class="gatechip">Gate</span>':''}${m.crit?'<span class="critchip">Watch</span>':''}${badge}${pd}${held}${accelaChip(c.accela)}</div>
  </div>`;
}

  const depTxt=depGroups(m,p,byId).map(g=>g.map(id=>byId[id].t).join(' or ')).join(' + ');
  const opts=STATUSES.map(st=>`<option value="${st.k}" ${c.status===st.k?'selected':''}>${st.label}</option>`).join('');
  const own=accelaOwned(p,c);
  return `<div class="detail">
    <div class="dt">${m.t} ${m.gate?'<span class="gatechip">Gate</span>':''} ${m.crit?'<span class="critchip">Watch</span>':''}
      <button class="xbtn" onclick="selectMs(null)">close ✕</button></div>

      <div class="cg"><label>Status${own?' <span class="lockn">· set by Accela</span>':''}</label><select ${own?'disabled title="Set by Accela — change it in Accela, not here"':''} onchange="setStatus('${p.id}','${m.id}',this.value)">${opts}</select></div>
      <div class="cg"><label>Owner</label><input type="text" style="width:120px" value="${esc(c.owner||'')}" onchange="setField('${p.id}','${m.id}','owner',this.value)"></div>
      <div class="cg"><label>Vendor / who's doing it</label><input type="text" style="width:150px" value="${esc(c.vendor||'')}" placeholder="${esc(m.agency)}" onchange="setField('${p.id}','${m.id}','vendor',this.value)"></div>

  <p><b>Accela emails (v4.11):</b> every <b>Monday, Wednesday and Friday</b> morning management@ (Brian, Adam and Wendell) gets the <b>digest</b>, regardless: <b>one section per project on this board, by address</b>, each with its City records — where each stands, each open step (department, the City reviewer, the City's due date, late or due soon) and what moved since the last check. On the other days an <b>alert</b> comes only when something <b>moves</b> in Accela on one of these records (a review finished, revisions requested, fees assessed, a step opened or its due date moved, a City step going overdue, a new record on the board), grouped by project the same way. The board's own due dates aren't part of either.</p>

  html+=`<div class="footer"><b>TTV Permitting Dashboard v4.13</b> · Subdivide × Sublot flow engine (mtg 2026-08-13) · team edits save to the shared record · timeline target: beat the ~17-week Dellinger baseline · Mecklenburg County / City of Charlotte · Tracks view staging is computed from the live dependency graph; week labels are indicative (from expected durations), not commitments. Audited Aug 2026 vs charlottenc.gov, mecknc.gov, charlotteudo.org, gis.mecknc.gov + TTV Development Brain + SOP-04 + live project email history. Confirm live figures with each agency before they drive a permit, contract, or underwrite.</div>`;

function selectMs(id){selMs=(selMs===id?null:id);renderProject();}
function setStatus(pid,mid,val){
  const p=PROJECTS.find(x=>x.id===pid),c=p.state[mid];
  if(accelaOwned(p,c)){toast('⚠ This step\'s status comes from Accela — change it in Accela, not here',true);render();return;}
  if((val==='active'||val==='submitted')&&!c.started)c.started=fmtDate(today);
  if(val==='todo')c.started=null;
  c.status=val;render();
  saveState({op:'setMilestone',projectId:pid,milestoneId:mid,changes:{...c}});
}
function setField(pid,mid,field,val){
  const c=PROJECTS.find(x=>x.id===pid).state[mid];c[field]=val;render();
  const saved=saveState({op:'setMilestone',projectId:pid,milestoneId:mid,changes:{...c}});
  if(field==='ref'&&cityRef(val))saved.then(ok=>{if(ok)syncAccela();}); /* a new City number: let Accela set the status now */
}

function openNew(){document.getElementById('overlay').classList.add('show');}
function closeNew(){document.getElementById('overlay').classList.remove('show');}
function createProject(){
  const addr=document.getElementById('f-addr').value.trim()||'Untitled parcel';
  const flags=migrateFlags({
    subdiv:document.getElementById('f-subdiv').checked,
    sublot:document.getElementById('f-sublot').checked,
    demo:document.getElementById('f-demo').checked,trees:document.getElementById('f-trees').checked,
    state:document.getElementById('f-state').checked,acre:document.getElementById('f-acre').checked});
  const units=Math.max(1,parseInt(document.getElementById('f-units').value,10)||1);
  const lots=Math.max(1,parseInt(document.getElementById('f-lots').value,10)||1);
  const st=blankState(flags);st['route'].status='done';
  const id='p-'+Math.abs(hash(addr+PROJECTS.length));
  const proj={id,addr,flags,units,lots,state:st};
  PROJECTS.push(proj);
  selId=id;selMs=null;
  document.getElementById('f-addr').value='';
  closeNew();render();
  saveState({op:'addProject',project:proj});
}
function deleteProject(pid){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;
  if(!confirm(`Remove "${p.addr}" from the board for EVERYONE?\n\nThis deletes it from the shared record (the Listener will log the removal). There is no undo from the board.`))return;
  PROJECTS=PROJECTS.filter(x=>x.id!==pid);
  if(selId===pid){selId=PROJECTS.length?PROJECTS[0].id:null;selMs=null;}
  render();
  saveState({op:'delProject',projectId:pid});
}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i)|0;}return h;}

/* ── write path: edits stick for the whole team ─────────────────────────
   POSTs a small patch to /api/permits; the proxy holds the feed token as a
   server-side secret (Vercel env) and forwards to the TTV Permit Feed, which
   updates ttv-permit-state.json in place. The Listener adopts manual edits
   into the system of record each morning (tagged with the editor's name). */
let EDITOR=null; /* in-memory only — no new storage keys per AGENTS.md */
function ensureEditor(){
  if(!EDITOR){const v=prompt('Quick one-time thing: your name for the edit log?','');EDITOR=((v||'').trim()||'team');}
  return EDITOR;
}
async function saveState(patch){
  if(!DATA_META.live){toast('⚠ Not saved — board is offline; your change is on this screen only',true);return;}
  ensureEditor();
  try{
    const r=await fetch('/api/permits',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({k:GATE_HASH,editor:EDITOR,patch})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
    toast('✓ Saved to the shared record');
    return true;
  }catch(e){toast('⚠ Save failed ('+((e&&e.message)||e)+') — change is on this screen only',true);return false;}
}
function toast(msg,bad){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;t.className=bad?'bad':'';t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500);
}


/* ── Accela (v4.6): email FINDS, Accela UPDATES ─────────────────────────────
   The Permit Listener's email scan finds new items and puts their City record numbers on the board;
   from then on Accela Citizen Access owns the STATUS of every step carrying an LDIRL / LDPLAT number.
   On each load the board asks /api/accela to sync: the server reads the shared record, looks each
   City record up in Accela (public pages, no login) and saves Accela's answer back (editor "Accela").
   Accela's status is shown even if that save fails — it is the source of truth. The status picker is
   locked on those steps; owner / due / vendor / ref stay editable. In-memory only (no storage keys). */
const CITY_REF=/\b(LD[A-Z]{2,6}|ZV|ZUP|CPB|RSVA)-\d{4}-\d{3,7}\b/i;
function cityRef(s){const m=CITY_REF.exec(String(s||''));return m?m[0].toUpperCase():null;}
const ACCELA_URL=ref=>'https://aca-prod.accela.com/CHARLOTTE/Cap/GlobalSearchResults.aspx?QueryText='+encodeURIComponent(ref);
let ACCELA={state:'idle'};
/* owned = the block says this record sets the step AND that record number is still on the project
   (a removed / moved ref must not leave the step locked) */
function accelaOwned(p,c){return !!(c&&c.accela&&c.accela.owns&&c.accela.board&&p&&Object.values(p.state).some(x=>cityRef(x&&x.ref)===c.accela.rec));}
function shortDate(d){const[y,m,dd]=String(d||'').split('-').map(Number);return m&&dd?m+'/'+dd:'';}
function accelaChip(a){
  if(!a)return'';
  const lbl=a.board==='done'?'✓ '+(a.stepDate?shortDate(a.stepDate):'approved')
    :'· '+(a.board==='active'?(/fee/i.test(a.why||'')?'fees due':/revision/i.test(a.why||'')?'revisions':'on us')
    :a.board==='submitted'?'in review':String(a.status||'no status').toLowerCase());
  return `<span class="acchip ac-${a.board||'none'}" title="${esc(a.why||'')}">Accela ${esc(lbl)}</span>`;
}
function accelaBox(p,c){
  const a=c.accela;if(!a)return'';
  const rec=ACCELA.records&&ACCELA.records[a.rec];
  let h=`<div class="acbox"><div class="ach">🏛 Accela · <a href="${ACCELA_URL(a.rec)}" target="_blank" rel="noopener">${esc(a.rec)}</a>${a.type?` · ${esc(a.type)}`:''} · record status <b>${esc(a.status||'—')}</b> ${accelaChip(a)}</div>`;
  h+=`<div class="acw">${esc(a.why||'')}${a.step?` · ${a.board==='done'?'':'now: '}${esc(a.step)} — ${esc(a.stepStatus||'')}${a.stepDate?' '+shortDate(a.stepDate):''}`:''}</div>`;
  h+=`<div class="acw">${accelaOwned(p,c)?'<b>Accela sets this step\'s status</b> — change it in Accela, not here.':'Shown for reference — this record doesn\'t set this step\'s status.'} Opened ${esc(a.opened||'—')} · last City activity ${esc(a.asOf||'—')}${rec&&rec.ok?' · checked just now':''}</div>`;
  /* who has it now: each open review step, the City reviewer assigned and the City's own due date (live only —
     reviewer names never go into the saved block) */
  const open=rec&&rec.ok?(rec.tasks||[]).filter(t=>t.state==='active'&&t.current):[];
  /* lateness only where the City holds the step (task.cityHolds, the email's rule) and the record is still in review —
     an approved record's open inspection isn't a late review */
  const late=(d,t)=>{if(!d||!t.cityHolds||a.board==='done'||a.board==='blocked')return'';const n=daysBetween(today,pdate(d));
    return n>0?` <span style="color:var(--red);font-weight:700">${n} day${n>1?'s':''} late</span>`:n===0?' <b>due today</b>':'';};
  if(open.length)
    h+=`<div class="acw"><b>Now with:</b> ${open.map(t=>`${esc(t.name)}${t.current.assignedTo?` — ${esc(t.current.assignedTo)}`:''}${t.current.cityDue?` · City due ${shortDate(t.current.cityDue)}${late(t.current.cityDue,t)}`:''}`).join('; ')}</div>`;
  if(rec&&rec.ok&&rec.tasks&&rec.tasks.length)
    h+=`<div class="acsteps">`+rec.tasks.map(t=>{
      const l=t.latest,cls=t.state==='active'?'now':t.state==='complete'?'ok':'wait';
      const tip=t.history.map(x=>x.status+(x.date?' '+x.date:'')).join(' → ')+(t.comment?' — '+t.comment:'');
      return `<div class="${cls}" title="${esc(tip)}"><b>${esc(t.name)}</b>${l?` — ${esc(l.status)}${l.date?' '+shortDate(l.date):''}`:''}</div>`;
    }).join('')+`</div>`;
  if(rec&&rec.related&&rec.related.length)
    h+=`<div class="acw">Related in Accela: ${rec.related.map(r=>`<a href="${ACCELA_URL(r.ref)}" target="_blank" rel="noopener">${esc(r.ref)}</a>${r.type?' ('+esc(r.type)+')':''}`).join(', ')}</div>`;
  if(rec&&!rec.ok)h+=`<div class="acw">⚠ Accela lookup failed just now (${esc(rec.error||'unknown')}) — showing the last saved Accela status.</div>`;
  return h+`</div>`;
}
function accelaNote(){
  const A=ACCELA;
  if(A.state==='loading')return `🏛 <b>Checking Accela</b> for ${A.n} City record${A.n>1?'s':''}…`;
  if(A.state==='error')return `⚠ <b>Accela check failed</b> (${esc(A.error)}) — showing the last saved Accela status.`;
  if(A.state!=='ok')return '';
  const recs=Object.values(A.records),okN=recs.filter(r=>r.ok).length;
  const moved=A.items.filter(i=>i.owns&&i.accela&&i.from!==i.to);
  const at=new Date(A.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const step=id=>(CATALOG.find(m=>m.id===id)||{t:id}).t.split(' — ')[0];
  let s=`🏛 <b>Accela</b> checked ${esc(at)} — ${okN} of ${recs.length} City record${recs.length===1?'':'s'} read; Accela sets the status of those steps.`;
  if(moved.length)s+=` <b>${moved.length} status update${moved.length>1?'s':''}:</b> `+moved.map(i=>`${esc(String(i.addr).split(' (')[0])} · ${esc(step(i.milestoneId))} → ${esc(i.accela.why)}`).join('; ')+'.';
  if(A.deferred)s+=` ${A.deferred} more will save on the next check.`;
  if(A.failed)s+=` ⚠ ${A.failed} couldn't be saved to the shared record — shown here from Accela.`;
  else if(A.dry&&A.items.some(i=>i.change))s+=` (shown here only, not saved: ${esc(A.dryWhy||'save path not configured')})`;
  return s;
}
/* one sync at a time: a ref saved while the on-load sync runs queues behind it instead of racing it */
let accelaRun=Promise.resolve();
function syncAccela(){accelaRun=accelaRun.then(runAccelaSync,runAccelaSync);return accelaRun;}
async function runAccelaSync(){
  const n=new Set(PROJECTS.flatMap(p=>Object.values(p.state).map(c=>cityRef(c&&c.ref)).filter(Boolean))).size;
  if(!n){ACCELA={state:'idle'};return;}
  ACCELA={state:'loading',n};renderProject();
  try{
    const r=await fetch('/api/accela',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:GATE_HASH,op:'sync'})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
    (d.items||[]).forEach(it=>{
      const p=PROJECTS.find(x=>x.id===it.projectId),c=p&&p.state[it.milestoneId];
      if(!c)return;
      if(it.cleared){delete c.accela;return;}
      if(!it.accela)return;
      c.accela=it.accela;
      if(accelaOwned(p,c)){c.status=it.accela.board;if(!c.started&&it.accela.opened&&c.status!=='todo')c.started=it.accela.opened;}
    });
    ACCELA={state:'ok',at:d.checkedAt,records:d.records||{},items:d.items||[],failed:d.failed||0,deferred:d.deferred||0,dry:!!d.dry,dryWhy:d.dryWhy||''};
  }catch(e){ACCELA={state:'error',error:(e&&e.message)||String(e)};}
  render();
}

/* --- API token: GATE_HASH is the shared `?k=` value api/permits.js expects on GET and POST.
   The browser passcode gate that used to sit in front of this board was removed 2026-09-17
   (team decision) — the board opens directly. The `?k=` check on the API is unchanged. --- */
const GATE_HASH='9b748ce71c59791771ab14a3de4bb0a2822eac70555d3e292ac7160af8fa1cc6';

/* --- data boot: paint the built-in snapshot instantly, then swap to live Drive data --- */
let DATA_META={live:false,loading:true};
async function loadLive(){
  try{
    const r=await fetch('/api/permits?k='+GATE_HASH,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const ok=d&&Array.isArray(d.projects)&&d.projects.length&&d.projects.every(p=>p&&p.id&&p.addr&&p.flags&&p.state);
    if(!ok)throw new Error('bad payload');
    PROJECTS=d.projects.map(fixState); /* migrate legacy flags + backfill new catalog ids */
    if(!PROJECTS.some(p=>p.id===selId)){selId=PROJECTS[0].id;selMs=null;}
    DATA_META={live:true,updated:d.updated||null};
  }catch(e){
    DATA_META={live:false,error:(e&&e.message)||String(e)};
  }
  render();
  if(DATA_META.live)syncAccela();
}
seed();render();
loadLive();
</script>
